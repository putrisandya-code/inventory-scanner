<script>
// ==================================================
// VARIABEL & KONFIGURASI APPS SCRIPT
// ==================================================
// Isi dengan Web App URL dari Deployment Google Apps Script Anda (berakhiran /exec)
const APPS_SCRIPT_URL = 'hhttps://script.google.com/a/macros/mitraprodin.com/s/AKfycbzBaQqMEMl9RaDrUvcPKwwyKnKCCFQwPjnYTJf1HD7oteZjqLftTL5pFHjO7MGEfYyDZQ/exec';

let html5QrCode = null;
let scannerRunning = false;

// ==================================================
// PARAMETER
// ==================================================
const params = new URLSearchParams(window.location.search);
const token = params.get('token') || '';

// ==================================================
// TAMPILKAN ERROR & HASIL
// ==================================================
function showError(message) {
  const el = document.getElementById('error');
  el.textContent = message;
  el.classList.remove('hidden');
}

function showResult(code) {
  const el = document.getElementById('result');
  el.textContent = 'Barcode terbaca: ' + code;
  el.classList.remove('hidden');
}

// ==================================================
// MULAI SCANNER
// ==================================================
async function startScanner() {
  if (scannerRunning) return;

  document.getElementById('error').classList.add('hidden');

  try {
    html5QrCode = new Html5Qrcode('reader');

    const config = {
      fps: 10,
      qrbox: function(w, h) {
        return {
          width: Math.floor(w * 0.85),
          height: Math.min(220, Math.floor(h * 0.40))
        };
      },
      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.EAN_13
      ]
    };

    await html5QrCode.start(
      { facingMode: "environment" },
      config,
      onScanSuccess,
      onScanFailure
    );

    scannerRunning = true;
  } catch (error) {
    console.error(error);
    showError('Tidak dapat membuka kamera: ' + error);
    scannerRunning = false;
  }
}

// ==================================================
// BERHASIL SCAN & KIRIM KE APPS SCRIPT
// ==================================================
async function onScanSuccess(decodedText, decodedResult) {
  if (!scannerRunning) return;

  const code = String(decodedText || '').trim();
  if (!code) return;

  scannerRunning = false;
  showResult(code);

  try {
    await html5QrCode.stop();
  } catch (error) {
    console.warn(error);
  }

  // 1. OPSI A: Jika dibuka via Popup Window (window.opener)
  if (window.opener && !window.opener.closed) {
    window.opener.postMessage({
      type: 'BARCODE_SCANNED',
      token: token,
      code: code
    }, '*');

    setTimeout(() => {
      try { window.close(); } catch (e) {}
    }, 500);
  } 
  // 2. OPSI B: Jika dibuka via Iframe Modal (window.parent)
  else if (window.parent && window.parent !== window) {
    window.parent.postMessage(code, '*');
  } 
  // 3. OPSI C: Fallback Redirect Langsung ke Apps Script
  else if (APPS_SCRIPT_URL && APPS_SCRIPT_URL !== '') {
    window.location.href = APPS_SCRIPT_URL + '?barcode=' + encodeURIComponent(code);
  } 
  else {
    showError('Halaman aplikasi utama tidak ditemukan. Silakan kembali ke Inventory Scanner.');
  }
}

function onScanFailure(errorMessage) {
  // Silent failure per frame
}

async function stopScanner() {
  if (!html5QrCode || !scannerRunning) return;
  try {
    await html5QrCode.stop();
  } catch (error) {
    console.warn(error);
  }
  scannerRunning = false;
}
</script>
